<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudioMax IA</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #050810;
    color: white;
    min-height: 100vh;
}

.container {
    display: flex;
    min-height: 100vh;
}

/* MENU */
.sidebar {
    width: 260px;
    background: #080d17;
    border-right: 1px solid #20283a;
    padding: 25px 18px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 35px;
    text-align: center;
}

.logo span {
    color: #6366f1;
}

.new-chat {
    width: 100%;
    padding: 14px;
    border: 1px solid #6366f1;
    border-radius: 10px;
    background: transparent;
    color: white;
    cursor: pointer;
    margin-bottom: 25px;
}

.menu-title {
    color: #8992a7;
    font-size: 13px;
    margin-bottom: 10px;
}

.menu-item {
    padding: 13px;
    border-radius: 8px;
    margin-bottom: 8px;
    background: #0c1220;
    cursor: pointer;
}

.menu-item:hover {
    background: #151d30;
}

/* CHAT */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 1100px;
    margin: auto;
    width: 100%;
}

.header {
    padding: 25px;
    text-align: center;
    border-bottom: 1px solid #20283a;
}

.header h1 {
    font-size: 22px;
}

.header p {
    color: #8992a7;
    margin-top: 7px;
}

.chat {
    flex: 1;
    padding: 25px;
    overflow-y: auto;
}

.message {
    display: flex;
    margin-bottom: 20px;
}

.message.user {
    justify-content: flex-end;
}

.message.ai {
    justify-content: flex-start;
}

.bubble {
    max-width: 75%;
    padding: 15px 18px;
    border-radius: 14px;
    line-height: 1.5;
}

.user .bubble {
    background: #303b61;
}

.ai .bubble {
    background: #111827;
    border: 1px solid #263149;
}

.input-area {
    padding: 20px;
    display: flex;
    gap: 10px;
    border-top: 1px solid #20283a;
}

.input-area input {
    flex: 1;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid #303a50;
    background: #0c1220;
    color: white;
    outline: none;
}

.input-area button {
    width: 55px;
    border: none;
    border-radius: 10px;
    background: #6366f1;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

/* PAINEL DO DONO */
.owner-panel {
    display: none;
    margin: 15px 0;
    padding: 20px;
    background: #0b1220;
    border: 1px solid #39456a;
    border-radius: 15px;
}

.owner-panel h2 {
    margin-bottom: 8px;
}

.owner-panel p {
    color: #aeb7c9;
    margin-bottom: 20px;
}

.owner-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.owner-card {
    background: #111a2b;
    border: 1px solid #273653;
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
}

.owner-card:hover {
    border-color: #6366f1;
}

.owner-card h3 {
    margin-bottom: 8px;
}

.owner-card p {
    font-size: 13px;
    margin: 0;
}

.close-panel {
    margin-top: 15px;
    padding: 10px 18px;
    background: transparent;
    border: 1px solid #6366f1;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}

@media (max-width: 700px) {
    .sidebar {
        display: none;
    }

    .owner-grid {
        grid-template-columns: 1fr;
    }

    .bubble {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- MENU NORMAL -->
    <aside class="sidebar">

        <div class="logo">
            Audio<span>Max</span>
        </div>

        <button class="new-chat" onclick="novaConversa()">
            + Nova conversa
        </button>

        <div class="menu-title">
            CONVERSAS RECENTES
        </div>

        <div class="menu-item">
            🎧 Fones Bluetooth
        </div>

        <div class="menu-item">
            💳 Formas de pagamento
        </div>

        <div class="menu-item">
            📦 Entrega e prazos
        </div>

        <!--
            O PAINEL DO DONO NÃO APARECE AQUI.
            ELE SÓ É ACESSADO PELA IA.
        -->

    </aside>


    <!-- ÁREA PRINCIPAL -->
    <main class="main">

        <header class="header">
            <h1>🤖 IA da AudioMax</h1>
            <p>Assistente virtual da loja</p>
        </header>


        <section class="chat" id="chat">

            <div class="message ai">
                <div class="bubble">
                    👋 Olá! Eu sou a IA da AudioMax.<br>
                    Como posso ajudar?
                </div>
            </div>

        </section>


        <!-- ÁREA DE DIGITAÇÃO -->
        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Digite sua mensagem..."
                autocomplete="off"
            >

            <button onclick="enviarMensagem()">➤</button>

        </div>

    </main>

</div>


<script>

const SENHA_DONO = "Marco10";
const NOME_DONO = "Marco Antônio";

let esperandoSenha = false;
let painelAberto = false;


/* ADICIONAR MENSAGEM */
function adicionarMensagem(texto, tipo) {

    const chat = document.getElementById("chat");

    const message = document.createElement("div");
    message.className = "message " + tipo;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.innerHTML = texto;

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}


/* ENVIAR MENSAGEM */
function enviarMensagem() {

    const input = document.getElementById("messageInput");

    const mensagemOriginal = input.value.trim();

    if (!mensagemOriginal) return;

    adicionarMensagem(mensagemOriginal, "user");

    input.value = "";

    setTimeout(() => {

        responderIA(mensagemOriginal);

    }, 400);
}


/* INTELIGÊNCIA DA IA */
function responderIA(mensagem) {

    const texto = mensagem
        .toLowerCase()
        .trim();


    /*
    ==========================================
    ACESSO AO PAINEL DO DONO
    ==========================================
    */

    if (
        texto === "painel do dono" ||
        texto === "painel dono" ||
        texto === "abrir painel do dono"
    ) {

        if (painelAberto) {

            adicionarMensagem(
                "O painel do dono já está aberto.",
                "ai"
            );

            return;
        }

        esperandoSenha = true;

        adicionarMensagem(
            "🔐 Acesso ao painel do dono solicitado.<br><br>" +
            "Qual é a senha?",
            "ai"
        );

        return;
    }


    /*
    ==========================================
    VERIFICAÇÃO DA SENHA
    ==========================================
    */

    if (esperandoSenha) {

        if (mensagemOriginalEhSenha(texto)) {

            esperandoSenha = false;
            painelAberto = true;

            adicionarMensagem(
                "✅ <strong>Acesso autorizado!</strong><br><br>" +
                "Bem-vindo ao painel do dono, " +
                NOME_DONO + ".",
                "ai"
            );

            mostrarPainel();

        } else {

            esperandoSenha = false;

            adicionarMensagem(
                "❌ Senha incorreta.<br><br>" +
                "O acesso ao painel foi negado.",
                "ai"
            );
        }

        return;
    }


    /*
    ==========================================
    QUEM É O DONO?
    ==========================================
    */

    if (
        texto.includes("quem é o dono") ||
        texto.includes("quem que é o dono") ||
        texto.includes("dono do site") ||
        texto.includes("dono dela") ||
        texto.includes("quem criou o site") ||
        texto.includes("quem criou a loja")
    ) {

        adicionarMensagem(
            "👑 O dono do site e da AudioMax é " +
            "<strong>" + NOME_DONO + "</strong>.",
            "ai"
        );

        return;
    }


    /*
    ==========================================
    SAUDAÇÕES
    ==========================================
    */

    if (
        texto === "oi" ||
        texto === "olá" ||
        texto === "ola" ||
        texto.includes("bom dia") ||
        texto.includes("boa tarde") ||
        texto.includes("boa noite")
    ) {

        adicionarMensagem(
            "Olá! 👋 Sou a IA da AudioMax. " +
            "Posso ajudar com produtos, pedidos, pagamentos, " +
            "entregas ou informações sobre a loja.",
            "ai"
        );

        return;
    }


    /*
    ==========================================
    PRODUTOS
    ==========================================
    */

    if (
        texto.includes("fone") ||
        texto.includes("produto") ||
        texto.includes("bluetooth")
    ) {

        adicionarMensagem(
            "🎧 A AudioMax é especializada em " +
            "fones Bluetooth e acessórios de áudio.",
            "ai"
        );

        return;
    }


    /*
    ==========================================
    PAGAMENTO
    ==========================================
    */

    if (
        texto.includes("pagamento") ||
        texto.includes("pix") ||
        texto.includes("cartão")
    ) {

        adicionarMensagem(
            "💳 A AudioMax pode oferecer diferentes " +
            "formas de pagamento, como Pix e cartão.",
            "ai"
        );

        return;
    }


    /*
    ==========================================
    RESPOSTA PADRÃO
    ==========================================
    */

    adicionarMensagem(
        "🤖 Ainda estou aprendendo. Você pode perguntar " +
        "sobre os produtos, pagamentos, entregas ou " +
        "escrever <strong>painel do dono</strong>.",
        "ai"
    );
}


/*
==========================================
VERIFICAR SENHA
==========================================
*/

function mensagemOriginalEhSenha(texto) {

    return texto === SENHA_DONO.toLowerCase();
}


/*
==========================================
MOSTRAR PAINEL
==========================================
*/

function mostrarPainel() {

    const chat = document.getElementById("chat");

    const painel = document.createElement("div");

    painel.className = "message ai";

    painel.innerHTML = `

        <div class="bubble" style="width:100%;">

            <div class="owner-panel" style="display:block;">

                <h2>👑 Painel do Dono</h2>

                <p>
                    Área administrativa da AudioMax —
                    acesso autorizado para ${NOME_DONO}.
                </p>

                <div class="owner-grid">

                    <div class="owner-card"
                         onclick="painelFuncao('Dashboard')">
                        <h3>📊 Dashboard</h3>
                        <p>Visão geral da loja</p>
                    </div>

                    <div class="owner-card"
                         onclick="painelFuncao('Produtos')">
                        <h3>🎧 Produtos</h3>
                        <p>Gerenciar produtos</p>
                    </div>

                    <div class="owner-card"
                         onclick="painelFuncao('Pedidos')">
                        <h3>📦 Pedidos</h3>
                        <p>Ver e gerenciar pedidos</p>
                    </div>

                    <div class="owner-card"
                         onclick="painelFuncao('Clientes')">
                        <h3>👥 Clientes</h3>
                        <p>Gerenciar clientes</p>
                    </div>

                    <div class="owner-card"
                         onclick="painelFuncao('Pagamentos')">
                        <h3>💳 Pagamentos</h3>
                        <p>Transações da loja</p>
                    </div>

                    <div class="owner-card"
                         onclick="painelFuncao('Configurações')">
                        <h3>⚙️ Configurações</h3>
                        <p>Configurações da loja</p>
                    </div>

                </div>

                <button
                    class="close-panel"
                    onclick="fecharPainel()">
                    Sair do painel
                </button>

            </div>

        </div>
    `;

    chat.appendChild(painel);

    chat.scrollTop = chat.scrollHeight;
}


/*
==========================================
FUNÇÕES DO PAINEL
==========================================
*/

function painelFuncao(funcao) {

    adicionarMensagem(
        "🛠️ Você abriu: <strong>" +
        funcao +
        "</strong>.<br><br>" +
        "Essa função pode ser conectada ao sistema " +
        "real da sua loja.",
        "ai"
    );
}


/*
==========================================
FECHAR PAINEL
==========================================
*/

function fecharPainel() {

    painelAberto = false;

    adicionarMensagem(
        "🔒 Você saiu do painel do dono.",
        "ai"
    );
}


/*
==========================================
NOVA CONVERSA
==========================================
*/

function novaConversa() {

    const chat = document.getElementById("chat");

    chat.innerHTML = `
        <div class="message ai">
            <div class="bubble">
                👋 Nova conversa iniciada.<br><br>
                Como posso ajudar?
            </div>
        </div>
    `;

    esperandoSenha = false;
    painelAberto = false;
}


/*
==========================================
ENTER PARA ENVIAR
==========================================
*/

document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            enviarMensagem();
        }

    });

</script>

</body>
</html>
